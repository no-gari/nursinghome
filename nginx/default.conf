upstream django {
    server app:8000;
}

# HTTP to HTTPS 리다이렉트
server {
    listen 80;
    server_name anonnursing.com www.anonnursing.com;

    # Let's Encrypt 인증서 검증용 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # 나머지 모든 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 서버
server {
    listen 443 ssl http2;
    server_name anonnursing.com www.anonnursing.com;
    client_max_body_size 100M;

    # SSL 인증서 설정
    ssl_certificate /etc/letsencrypt/live/anonnursing.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anonnursing.com/privkey.pem;

    # SSL 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (HTTP Strict Transport Security) 헤더
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 기타 보안 헤더
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # WebSocket 연결 타임아웃 설정
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # 미디어 파일을 Django로 전달 (S3 리다이렉트 처리)
    location /media/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 정적 파일을 Django로 전달 (S3 리다이렉트 처리)
    location /static/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 전용 location (중요!)
    location /ws/ {
        proxy_pass http://django;

        # WebSocket 필수 헤더들
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 기본 프록시 헤더들
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # WebSocket 타임아웃 설정 (24시간)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # 프록시 버퍼링 비활성화 (실시간 통신을 위해)
        proxy_buffering off;
    }

    # 일반 HTTP 요청 처리
    location / {
        try_files $uri @proxy_to_app;
    }

    location @proxy_to_app {
        proxy_pass http://django;

        # HTTP/1.1 사용하되 WebSocket 업그레이드는 조건부로
        proxy_http_version 1.1;

        # 조건부 Connection 헤더 설정
        proxy_set_header Connection "";

        # 기본 프록시 헤더들
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # 요청 타임아웃
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}