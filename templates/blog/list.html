<!DOCTYPE html>
<html lang="ko" class="h-full" data-page="blog-list">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>블로그 - CareBridge</title>
    <meta name="description" content="요양시설 인사이트 & 케어 관련 매거진 스타일 블로그">
    <meta property="og:title" content="블로그 - CareBridge"/>
    <meta property="og:description" content="요양시설 인사이트 & 케어 관련 매거진 스타일 블로그"/>
    <meta property="og:type" content="website"/>
    <meta property="og:url" content="{{ request.build_absolute_uri }}"/>
    <meta property="og:image" content="{% if featured and featured.cover_image %}{{ featured.cover_image.url }}{% endif %}"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI','Roboto','Helvetica Neue',Arial,sans-serif;}
        .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
        .line-clamp-3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
        .focus-ring:focus{outline:2px solid #6366f1;outline-offset:2px;}
        .img-hover{transition:transform .5s ease, box-shadow .4s ease;} .group:hover .img-hover{transform:scale(1.03);}
        .hdr{transition:height .2s ease, box-shadow .2s ease, background .2s ease;}
        .hdr:not(.shrink){height:70px;} .hdr.shrink{height:56px;}
        .tag-overlay span{background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(4px);}
        .loader{width:56px;height:56px;position:relative;}
        .loader:after{content:"";position:absolute;inset:0;border-radius:50%;border:6px solid #6366f1;border-color:#6366f1 transparent #6366f1 transparent;animation:spin 1s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}
    </style>
</head>
<body class="min-h-full bg-white text-slate-900 antialiased selection:bg-indigo-200/60">
<header id="siteHeader" class="hdr sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200 flex flex-col justify-center">{% include 'core/_navbar.html' %}</header>

<main class="max-w-7xl mx-auto px-5 py-10">
    <div class="flex flex-col gap-10">
        <!-- 상단: 카테고리 필터 -->
        <div id="categoryFilter" class="flex flex-wrap gap-3 items-center">
            <a href="#" data-category="" class="category-link px-3 py-1.5 rounded-full text-xs font-medium border transition {% if not current_category %}bg-slate-800 text-white border-slate-800{% else %}border-slate-300 bg-slate-100 text-slate-600 hover:border-slate-500{% endif %}">전체</a>
            {% for cat in categories %}
            <a href="#" data-category="{{ cat.slug }}" class="category-link px-3 py-1.5 rounded-full text-xs font-medium border transition {% if cat.slug == current_category %}bg-slate-800 text-white border-slate-800{% else %}border-slate-300 bg-slate-100 text-slate-600 hover:border-slate-500{% endif %}">{{ cat.name }}</a>
            {% endfor %}
        </div>

        <!-- 결과 영역 -->
        <div id="blog-results">
            {% include 'blog/_list_results.html' %}
        </div>
    </div>
</main>

{% include 'core/_footer.html' %}

<script>
// 헤더 shrink
const header = document.getElementById('siteHeader');
function onScroll() {
    if (window.scrollY > 120) header.classList.add('shrink');
    else header.classList.remove('shrink');
}
window.addEventListener('scroll', onScroll, {passive: true});
onScroll();

// 블로그 AJAX 기능 (병원/시설 리스트와 동일한 패턴)
(function(){
    const resultsContainer = document.getElementById('blog-results');
    const categoryFilter = document.getElementById('categoryFilter');

    if (!resultsContainer || !categoryFilter) return;

    let currentCategory = '{{ current_category|default:"" }}';
    let isLoading = false;

    function setLoading() {
        if (isLoading) return;
        isLoading = true;
        resultsContainer.innerHTML = `
            <div class="w-full flex flex-col items-center justify-center py-24 gap-4" role="status" aria-live="polite">
                <div class="loader" aria-hidden="true"></div>
                <div class="text-sm text-slate-500 font-medium">블로그 불러오는 중...</div>
            </div>`;
    }

    function clearLoading() {
        isLoading = false;
    }

    function buildQuery(cat, page) {
        const params = new URLSearchParams();
        if (cat) params.set('category', cat);
        if (page && page > 1) params.set('page', page);
        params.set('ajax', '1');
        return params;
    }

    function updateCategoryActive(cat) {
        const activeClasses = ['bg-slate-800', 'text-white', 'border-slate-800'];
        const inactiveClasses = ['border-slate-300', 'bg-slate-100', 'text-slate-600'];

        categoryFilter.querySelectorAll('a[data-category]').forEach(link => {
            const category = link.dataset.category || '';
            const active = (category === (cat || ''));

            link.classList.remove(...(active ? inactiveClasses : activeClasses));
            link.classList.add(...(active ? activeClasses : inactiveClasses));

            if (!active) {
                link.classList.add('hover:border-slate-500');
            } else {
                link.classList.remove('hover:border-slate-500');
            }
        });
    }

    function applyPaginationLinks() {
        resultsContainer.querySelectorAll('.page-link').forEach(a => {
            a.addEventListener('click', e => {
                e.preventDefault();
                const pageMatch = a.getAttribute('data-page');
                triggerFetch({page: pageMatch || '1'});
            });
        });
    }

    async function triggerFetch(extra = {}) {
        if (isLoading) return;
        setLoading();

        const params = buildQuery(currentCategory, extra.page);
        const url = location.pathname + '?' + params.toString();

        try {
            const resp = await fetch(url, {headers: {'X-Requested-With': 'XMLHttpRequest'}});
            if (!resp.ok) throw new Error('HTTP ' + resp.status);

            const html = await resp.text();
            resultsContainer.innerHTML = html;
            applyPaginationLinks();

            // URL 업데이트
            const visibleParams = buildQuery(currentCategory, extra.page);
            visibleParams.delete('ajax');
            const newUrl = location.pathname + (visibleParams.toString() ? ('?' + visibleParams.toString()) : '');
            history.replaceState({}, '', newUrl);

            window.scrollTo({top: 0, behavior: 'smooth'});
        } catch (e) {
            resultsContainer.innerHTML = '<div class="py-16 text-center text-red-500">오류가 발생했습니다.</div>';
            console.error(e);
        } finally {
            clearLoading();
        }
    }

    // 카테고리 클릭 이벤트
    categoryFilter.addEventListener('click', e => {
        const link = e.target.closest('a[data-category]');
        if (!link) return;

        e.preventDefault();
        const cat = link.dataset.category || '';

        if (cat === currentCategory) return;

        currentCategory = cat;
        updateCategoryActive(currentCategory);
        triggerFetch({page: 1});
    });

    // 초기화
    updateCategoryActive(currentCategory);
    applyPaginationLinks();
})();
</script>
</body>
</html>
