<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareBridge - AI 상담</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <meta name="csrf-token" content="{{ csrf_token }}" />
  <style>
    body { font-family:'Pretendard', -apple-system,BlinkMacSystemFont,'Segoe UI','Roboto',sans-serif; }
    .chat-scroll { scrollbar-width:thin; scrollbar-color:#cbd5e1 transparent; }
    .chat-scroll::-webkit-scrollbar { width:10px; }
    .chat-scroll::-webkit-scrollbar-track { background:transparent; }
    .chat-scroll::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:6px; border:2px solid transparent; background-clip:padding-box; }
    .chat-scroll::-webkit-scrollbar-thumb:hover { background:#94a3b8; }
    .msg-bubble a { text-decoration:underline; }
    .fade-top, .fade-bottom { position:sticky; height:20px; z-index:10; }
    .fade-top { top:0; background:linear-gradient(to bottom, rgba(255,255,255,1), rgba(255,255,255,0)); }
    .fade-bottom { bottom:0; background:linear-gradient(to top, rgba(255,255,255,1), rgba(255,255,255,0)); }
    @media (max-width: 768px){ .sidebar-col { display:none; } }
    /* Navbar height / transition (다른 페이지와 동일) */
    .hdr{transition:height .2s ease, box-shadow .2s ease, background .2s ease;}
    .hdr:not(.shrink){height:70px;}
    .hdr.shrink{height:56px;}
    .cb-modal-overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:1.25rem;z-index:1000;}
    .cb-modal-fade-enter-active,.cb-modal-fade-leave-active{transition:opacity .25s ease, transform .25s ease;}
    .cb-modal-fade-enter-from,.cb-modal-fade-leave-to{opacity:0;transform:scale(.95);}
    /* -------- Chat modernized styles (no gradients / no avatars) -------- */
    .chat-wrapper{display:flex;flex-direction:column;min-height:0;}
    .messages-stream{scroll-behavior:smooth;}
    .msg-row{position:relative;}
    .msg-bubble{border-radius:18px; padding:10px 16px; font-size:14.5px; line-height:1.6; box-shadow:0 1px 2px rgba(15,23,42,0.06); word-break:break-word; white-space:pre-wrap; background:#ffffff; border:1px solid #e2e8f0; max-width:100%;}
    .msg-user{background:#f5f3ff; color:#111827; border-color:#ddd6fe;}
    .msg-user a{color:#4338ca; text-decoration:underline;}
    .msg-group{text-align:left;}
    .msg-group.user{text-align:right;}
    .msg-group + .msg-group{margin-top:1rem;}
    .msg-meta{margin-top:4px; font-size:11px; color:#94a3b8;}
    .msg-bubble:focus{outline:2px solid #6366f1; outline-offset:2px;}
    .suggestion-pill{transition:.18s background-color, .18s border-color, .18s color;}
    .suggestion-pill:hover{border-color:#6366f1; background:#eef2ff; color:#4338ca;}
    /* Subtle fade for scroll edges already present */
    /* Remove old avatar spacing side-effects */
    .messages-container{padding-top:1rem;}
    /* Input area refinement */
    .chat-input{transition:border-color .15s, box-shadow .15s;}
    .chat-input:focus{border-color:#6366f1; box-shadow:0 0 0 2px rgba(99,102,241,0.25);}
    [v-cloak]{display:none !important;}
  </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
<header id="siteHeader" class="hdr sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-200 flex flex-col justify-center">
  {% include 'core/_navbar.html' %}
</header>
<main id="app" v-cloak class="flex-1 flex overflow-hidden relative">
  <!-- 모바일 오버레이 -->
  <div v-show="mobileSidebarOpen" class="fixed inset-0 z-30 bg-black/30 lg:hidden" @click="closeMobileSidebar"></div>

  <!-- Sidebar -->
  <aside :class="sidebarClasses">
    <div class="p-3 border-b border-slate-200 relative">
      <button @click="createSession" class="w-full inline-flex items-center justify-center gap-2 h-10 rounded-xl bg-white border border-slate-300 text-slate-700 hover:border-slate-500 hover:bg-slate-50 shadow-sm" title="새 대화">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M12 5v14M5 12h14"/></svg>
        <span class="text-sm font-medium">새 대화</span>
      </button>
      <button @click="closeMobileSidebar" class="lg:hidden absolute top-3 right-3 inline-flex items-center justify-center w-8 h-8 rounded-lg border border-slate-300 bg-white text-slate-600 hover:border-slate-500" title="닫기">
        <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="px-4 pt-2 pb-1 text-[11px] uppercase tracking-wider text-slate-500">대화 목록</div>

    <div class="flex-1 overflow-y-auto chat-scroll">
      <ul class="py-1 text-sm">
        <li v-for="s in sessions" :key="s.id" @click="selectSession(s.id)"
            :class="['group cursor-pointer mx-2 my-1 px-3 py-2 rounded-lg flex items-center gap-2', s.id===activeSessionId ? 'bg-white shadow-sm ring-1 ring-slate-200 text-slate-900' : 'text-slate-600 hover:bg-slate-100']">
          <span class="flex-1 truncate" v-text="s.title || '제목없음'"></span>
          <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition">
            <button @click.stop="renameSession(s)" class="w-6 h-6 rounded-md flex items-center justify-center text-slate-500 hover:text-slate-700 hover:bg-white/70 border border-transparent hover:border-slate-300" title="이름 변경">✎</button>
            <button @click.stop="openDeleteSession(s)" class="w-6 h-6 rounded-md flex items-center justify-center text-slate-500 hover:text-rose-600 hover:bg-white/70 border border-transparent hover:border-rose-300" title="삭제">
              <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6h14ZM10 11v6M14 11v6"/>
              </svg>
            </button>
          </div>
        </li>
      </ul>
      <div v-if="sessions.length===0" class="px-4 py-6 text-center text-xs text-slate-500">세션이 없습니다.</div>
    </div>
    <div class="p-3 border-t border-slate-200">
      <div class="flex gap-2 mb-2">
        <button @click="renameActive()" :disabled="!activeSessionObj" class="flex-1 h-9 rounded-lg border border-slate-300 bg-white text-slate-700 text-xs hover:border-slate-500 disabled:opacity-40">이름 변경</button>
        <button @click="openDeleteSession(activeSessionObj)" :disabled="!activeSessionObj" class="h-9 w-9 rounded-lg border border-slate-300 bg-white text-slate-600 hover:border-rose-400 hover:text-rose-600 disabled:opacity-40">🗑</button>
      </div>
      <div class="text-[11px] text-slate-500">자동 저장됩니다</div>
    </div>
  </aside>

  <!-- Chat column -->
  <section class="flex-1 flex flex-col min-w-0">
    <!-- Toolbar -->
    <div class="h-12 px-4 flex items-center gap-3 border-b border-slate-200 bg-white/70 backdrop-blur">
      <!-- 모바일 햄버거 -->
      <button @click="openMobileSidebar" class="lg:hidden inline-flex items-center justify-center w-9 h-9 rounded-lg border border-slate-300 bg-white text-slate-600 hover:border-slate-500" title="메뉴">
        <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <div class="flex items-center gap-2 text-slate-500">
        <span class="text-sm font-semibold text-slate-700" v-text="activeSessionTitle || '새 대화'"></span>
      </div>

      <div class="flex gap-2 ml-auto hidden">
        <button @click="renameActive()" :disabled="!activeSessionId" class="px-3 h-8 text-xs rounded-md border border-slate-300 bg-white text-slate-600 disabled:opacity-40 hover:border-slate-500 hover:text-slate-800">이름 변경</button>
        <button @click="createSession" class="px-3 h-8 text-xs rounded-md bg-indigo-600 text-white hover:bg-indigo-500">새 대화</button>
      </div>
    </div>

    <!-- Messages -->
    <div class="flex-1 overflow-y-auto chat-scroll relative" ref="messagesContainer">
      <div class="fade-top"></div>
      <div class="max-w-3xl mx-auto w-full px-4 pt-4 pb-40">
        <!-- Suggestions -->
        <div v-if="messages.length===0 && !isLoading" class="flex flex-wrap gap-3 mb-6">
          <button @click="setExample('서울 A등급 요양원 추천해줘')" class="px-4 py-2 rounded-full text-xs font-medium bg-white border border-slate-200 shadow-sm hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-700 transition">서울 A등급 추천</button>
          <button @click="setExample('대기자가 적은 곳 찾아줘')" class="px-4 py-2 rounded-full text-xs font-medium bg-white border border-slate-200 shadow-sm hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-700 transition">대기 적은 곳</button>
          <button @click="setExample('물리치료 프로그램 있는 곳 알려줘')" class="px-4 py-2 rounded-full text-xs font-medium bg-white border border-slate-200 shadow-sm hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-700 transition">물리치료 프로그램</button>
          <button @click="setExample('비급여 비용 저렴한 곳 비교해줘')" class="px-4 py-2 rounded-full text-xs font-medium bg-white border border-slate-200 shadow-sm hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-700 transition">비급여 저렴 비교</button>
          <button @click="setExample('경기도 10년 이상 운영 A등급 추천')" class="px-4 py-2 rounded-full text-xs font-medium bg-white border border-slate-200 shadow-sm hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-700 transition">경기 10년+ A등급</button>
        </div>
        <!-- Messages Loop (아바타 제거 버전) -->
        <div v-for="m in messages" :key="m.id" class="msg-group" :class="m.type==='user' ? 'user' : 'bot'">
          <div :class="['inline-block msg-bubble', m.type==='user' ? 'msg-user' : 'msg-bot']" v-html="formatMessage(m.content)"></div>
          <div v-if="m.sources && m.sources.length" class="mt-3 text-left p-3 rounded-xl bg-white border border-slate-200 text-[12px] text-slate-600 space-y-2 shadow-sm max-w-3xl">
            <div class="font-semibold text-slate-700 text-xs tracking-wide">참고 소스</div>
            <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
              <div v-for="s in m.sources" :key="s.id" class="group border border-slate-200 rounded-lg p-3 bg-slate-50/60 hover:bg-white hover:border-indigo-300 transition flex flex-col">
                <div class="flex items-start justify-between gap-2">
                  <div class="text-[11px] font-medium text-slate-700 leading-snug flex-1">
                    <span class="text-indigo-600">{{ s.rank }}.</span>
                    [{{ s.type }}] {{ s.name }}
                  </div>
                  <div v-if="s.distance!==undefined" class="text-[10px] text-slate-400">유사도 <span v-text="formatSimilarity(s.distance)"></span></div>
                </div>
                <div v-if="s.image_urls && s.image_urls.length" class="mt-2 flex gap-2 overflow-hidden">
                  <img v-for="(img,i) in s.image_urls.slice(0,2)" :key="i" :src="img" class="w-20 h-14 object-cover rounded-md border border-slate-200 bg-white" loading="lazy" />
                </div>
                <div class="mt-2 space-y-1 text-[11px] leading-relaxed break-all">
                  <div v-if="s.detail_url"><span class="font-semibold text-slate-500">상세:</span> <a :href="s.detail_url" target="_blank" class="text-indigo-600 underline decoration-dotted break-all">{{ s.detail_url }}</a></div>
                  <div v-if="s.image_urls && s.image_urls.length"><span class="font-semibold text-slate-500">대표사진:</span> <a :href="s.image_urls[0]" target="_blank" class="text-slate-600 hover:text-indigo-600 underline decoration-dotted" v-text="s.image_urls[0]"></a></div>
                  <div v-else><span class="font-semibold text-slate-500">대표사진:</span> 없음</div>
                </div>
                <a v-if="s.detail_url" :href="s.detail_url" target="_blank" class="mt-3 inline-flex items-center justify-center gap-1 text-[11px] px-2 py-1 rounded-md border border-slate-300 bg-white text-slate-600 hover:border-indigo-400 hover:text-indigo-600 hover:bg-indigo-50 transition">
                  <span>상세 페이지</span>
                  <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M5 10v11h11"/></svg>
                </a>
              </div>
            </div>
          </div>
        </div>
        <!-- Loading -->
        <div v-if="isLoading && !streamingBot" class="flex items-center gap-2 text-xs text-slate-500 mt-6">
          <span class="inline-flex w-5 h-5 rounded-full bg-slate-400 text-white items-center justify-center text-[10px]">AI</span>
          <span>답변 준비 중...</span>
          <span class="flex gap-1"><span class="w-2 h-2 rounded-full bg-slate-400 animate-pulse"></span><span class="w-2 h-2 rounded-full bg-slate-400 animate-pulse delay-150"></span><span class="w-2 h-2 rounded-full bg-slate-400 animate-pulse delay-300"></span></span>
        </div>
      </div>
      <div class="fade-bottom"></div>
    </div>

    <!-- Input -->
    <!-- 기존: 고��� 흰색 박스(bg-white/95 ...) -> 제거하고 투명 배경 + 떠 있는 입력 캡슐 -->
    <div class="fixed inset-x-0 bottom-0 pb-3 pt-2">
      <div class="max-w-3xl mx-auto px-4">
        <div class="relative">
          <!-- 상단 그라데이션 페이드 (메시지와 구분) -->
          <div class="pointer-events-none absolute -top-6 left-0 right-0 h-6 bg-gradient-to-t from-slate-50/90 via-slate-50/40 to-transparent"></div>
          <textarea v-model="currentMessage" @keydown.enter.exact.prevent="sendMessage" @keydown.enter.shift.prevent="insertNewline" rows="1"
                    :disabled="isLoading"
                    class="w-full resize-none rounded-2xl border border-slate-300 bg-white/90 backdrop-blur-sm px-4 py-4 pr-16 text-sm shadow-lg focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 max-h-52 placeholder-slate-400"
                    placeholder="무엇이든 물어보세요... (Shift+Enter 줄바꿈)"></textarea>
          <button @click="sendMessage" :disabled="isLoading || !currentMessage.trim()"
                  aria-label="메시지 전송"
                  class="absolute bottom-2.5 right-2.5 w-11 h-11 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed text-white shadow-md flex items-center justify-center transition">
            <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.4 20.6 21 12 3.4 3.4 5 10l9 2-9 2z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- (모달) 세션 이름 변경 -->
  <transition name="cb-modal-fade">
    <div v-if="renameDialog.open" class="cb-modal-overlay" @keydown.esc.prevent="cancelRename" @click.self="cancelRename">
      <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm"></div>
      <div class="relative w-full max-w-md origin-center rounded-2xl shadow-[0_8px_30px_-5px_rgba(15,23,42,0.25)] bg-white border border-slate-200 px-6 pt-7 pb-6">
        <h3 class="text-lg font-semibold tracking-tight text-slate-800 text-center mb-1">세션 이름 변경</h3>
        <p class="text-slate-500 text-xs text-center mb-5">대화 목록에서 쉽게 찾을 수 있는 이름으로 수정하세요.</p>
        <form @submit.prevent="confirmRenameSession" class="space-y-4">
          <div>
            <input ref="renameInput" v-model.trim="renameDialog.title" :disabled="renameDialog.saving" @keydown.enter.exact.prevent="confirmRenameSession" type="text" maxlength="80" class="w-full h-11 px-4 rounded-xl border border-slate-300 bg-white focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 text-sm placeholder-slate-400" placeholder="새 세션 이름" />
            <div class="mt-1 flex justify-between text-[11px] text-slate-400">
              <span v-if="renameDialog.error" class="text-rose-500" v-text="renameDialog.error"></span>
              <span class="ml-auto" v-text="renameDialog.title.length + '/80'"></span>
            </div>
          </div>
          <div class="flex gap-2 pt-1">
            <button type="button" @click="cancelRename" :disabled="renameDialog.saving" class="flex-1 h-10 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 text-sm font-medium transition disabled:opacity-40">취소</button>
            <button type="submit" :disabled="renameDisabled" class="flex-1 h-10 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium transition disabled:opacity-40 disabled:cursor-not-allowed inline-flex items-center justify-center gap-1">
              <svg v-if="renameDialog.saving" class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" class="opacity-20"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>
              <span>저장</span>
            </button>
          </div>
        </form>
        <button type="button" @click="cancelRename" class="absolute top-2.5 right-2.5 w-8 h-8 rounded-lg flex items-center justify-center text-slate-500 hover:text-slate-700 hover:bg-slate-100">
          <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
  </transition>

  <!-- (모달) 세션 삭제 확인 -->
  <transition name="cb-modal-fade">
    <div v-if="deleteDialog.open" class="cb-modal-overlay" @keydown.esc.prevent="cancelDelete" @click.self="cancelDelete">
      <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm"></div>
      <div class="relative w-full max-w-sm origin-center rounded-2xl shadow-[0_8px_30px_-5px_rgba(15,23,42,0.25)] bg-white border border-slate-200 px-6 pt-7 pb-6">
        <h3 class="text-lg font-semibold tracking-tight text-slate-800 text-center mb-2">세션 삭제</h3>
        <p class="text-slate-500 text-xs text-center mb-5" v-html="deleteDialogMessage"></p>
        <div v-if="deleteDialog.error" class="mb-3 text-center text-[11px] text-rose-600" v-text="deleteDialog.error"></div>
        <div class="flex gap-2">
          <button type="button" @click="cancelDelete" :disabled="deleteDialog.deleting" class="flex-1 h-10 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 text-sm font-medium transition disabled:opacity-40">취소</button>
          <button type="button" @click="confirmDeleteSession" :disabled="deleteDialog.deleting" class="flex-1 h-10 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-sm font-medium transition disabled:opacity-40 disabled:cursor-not-allowed inline-flex items-center justify-center gap-1">
            <svg v-if="deleteDialog.deleting" class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" class="opacity-20"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>
            <span>삭제</span>
          </button>
        </div>
        <button type="button" @click="cancelDelete" class="absolute top-2.5 right-2.5 w-8 h-8 rounded-lg flex items-center justify-center text-slate-500 hover:text-slate-700 hover:bg-slate-100">
          <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
  </transition>
</main>

<script>
  // 헤더 높이 shrink 효과 (다른 페이지와 동일)
  (function(){
    const headerEl=document.getElementById('siteHeader');
    function onScroll(){ if(window.scrollY>16){headerEl.classList.add('shrink','shadow-sm');} else {headerEl.classList.remove('shrink','shadow-sm');} }
    window.addEventListener('scroll',onScroll); onScroll();
  })();
  const { createApp } = Vue;
  createApp({
    data(){return{
      messages:[],currentMessage:'',isLoading:false,messageId:1,ws:null,wsConnected:false,reconnectWait:1000,streamingBot:null,pendingInit:null,
      sessions:[],activeSessionId:null,loadingSessions:false,
      mobileSidebarOpen:false,
      renameDialog:{open:false,session:null,title:'',saving:false,error:null},
      deleteDialog:{open:false,session:null,deleting:false,error:null}
    }},
    computed:{
      activeSessionTitle(){
        const s=this.sessions.find(x=>x.id===this.activeSessionId);
        return s ? s.title : '';
      },
      activeSessionObj(){
        const s=this.sessions.find(x=>x.id===this.activeSessionId);
        return s || null;
      },

      sidebarClasses(){
        return [
          'w-64 bg-slate-50 border-r border-slate-200 flex flex-col transition-transform duration-300 ease-in-out',
          // 모바일: fixed positioning with slide animation
          'fixed lg:static inset-y-0 left-0 z-40',
          // 모바일에서 열림/닫힘 상태
          this.mobileSidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'
        ].join(' ');
      },
      renameDisabled(){
        if(!this.renameDialog.open) return true;
        if(this.renameDialog.saving) return true;
        const orig=(this.renameDialog.session? this.renameDialog.session.title||'' : '').trim();
        const cur=this.renameDialog.title.trim();
        return !cur || cur===orig;
      },
      deleteDialogMessage(){
        const title=(this.deleteDialog.session && (this.deleteDialog.session.title || '제목없음')) || '제목없음';
        return `'${title}' 대화를 삭제할까요?<br>이 작업은 되돌릴 수 없습니다.`;
      }
    },
    mounted(){
      this.fetchSessions().then(()=>{
        const p=new URLSearchParams(window.location.search);
        const sid=p.get('session');
        const message=p.get('message');

        if(sid){
          this.selectSession(parseInt(sid));
        } else if(message) {
          // 메인 페이지에서 새로운 질문이 전달된 ��우 새 세션 생성
          this.createSessionAndSendMessage(decodeURIComponent(message));
        } else if(this.sessions.length){
          this.selectSession(this.sessions[0].id);
        }
      });
      this.setupWS();
    },
    methods:{
      csrf(){ return document.querySelector('meta[name="csrf-token"]').getAttribute('content'); },
      apiHeaders(json=true){ const h={'X-CSRFToken':this.csrf()}; if(json) h['Content-Type']='application/json'; return h; },

      // 사이��바 토글 메소��들
      openMobileSidebar(){
        this.mobileSidebarOpen = true;
        document.body.style.overflow = 'hidden';
      },
      closeMobileSidebar(){
        this.mobileSidebarOpen = false;
        document.body.style.overflow = 'auto';
      },

      async fetchSessions(){
        if(this.loadingSessions) return;
        this.loadingSessions=true;
        try{
          const r=await fetch('/api/chat/sessions/');
          if(r.ok){
            this.sessions=await r.json();
          }
        }catch(e){
          console.warn('세션 목록 로드 실패:', e);
        } finally{
          this.loadingSessions=false;
        }
      },

      async createSession(){
        try{
          const r=await fetch('/api/chat/sessions/',{
            method:'POST',
            headers:this.apiHeaders(),
            body:JSON.stringify({title:'새 대화'})
          });
          if(r.ok){
            const s=await r.json();
            this.sessions.unshift(s);
            this.selectSession(s.id,true);
            // 모바일에��� 새 세션 생�� 후 사이드바 닫기
            if(window.innerWidth < 1024) {
              this.closeMobileSidebar();
            }
          }
        }catch(e){
          console.warn('세션 생성 실패:', e);
        }
      },

      // 새 세션을 생성하고 메시지를 전송하는 메소드
      async createSessionAndSendMessage(message){
        try{
          const r=await fetch('/api/chat/sessions/',{
            method:'POST',
            headers:this.apiHeaders(),
            body:JSON.stringify({title:'새 대화'})
          });
          if(r.ok){
            const s=await r.json();
            this.sessions.unshift(s);
            this.activeSessionId=s.id;
            this.messages=[];

            // 모바일에서 새 세션 생성 후 사이드바 닫기
            if(window.innerWidth < 1024) {
              this.closeMobileSidebar();
            }

            // 메시지 전송
            this.currentMessage = message;
            this.$nextTick(() => {
              this.sendMessage();
            });
          }
        }catch(e){
          console.warn('세션 생성 및 메시지 전송 실패:', e);
        }
      },

      async selectSession(id, justCreated=false){
        if(this.activeSessionId===id) return;
        this.activeSessionId=id;
        this.messages=[];

        // 모바일에서 세션 선택 시 사이드바 닫기
        if(window.innerWidth < 1024) {
          this.closeMobileSidebar();
        }

        try{
          const r=await fetch(`/api/chat/sessions/${id}/messages/`);
          if(r.ok){
            const data=await r.json();
            for(const m of data.messages){
              this.messages.push(m);
              this.messageId++;
            }
            this.scrollToBottom();
            if(justCreated) this.focusInput();
          }
        }catch(e){
          console.warn('세션 메시지 ����� 실패:', e);
        }
      },

      renameActive(){ if(!this.activeSessionId) return; const s=this.sessions.find(x=>x.id===this.activeSessionId); if(!s) return; this.renameSession(s); },
      renameSession(s){
        this.renameDialog.session=s;
        this.renameDialog.title=(s.title||'').trim();
        this.renameDialog.error=null;
        this.renameDialog.open=true;
        this.$nextTick(()=>{ this.$refs.renameInput && this.$refs.renameInput.focus(); });
      },
      cancelRename(){
        if(this.renameDialog.saving) return;
        this.renameDialog.open=false;
        this.renameDialog.session=null;
        this.renameDialog.title='';
        this.renameDialog.error=null;
      },
      async confirmRenameSession(){
        if(this.renameDisabled) return;
        const s=this.renameDialog.session; if(!s) return;
        const newTitle=this.renameDialog.title.trim();
        this.renameDialog.saving=true; this.renameDialog.error=null;
        try{
          const r=await fetch(`/api/chat/sessions/${s.id}/`,{method:'PATCH',headers:this.apiHeaders(),body:JSON.stringify({title:newTitle})});
          if(r.ok){
            const updated=await r.json();
            const idx=this.sessions.findIndex(x=>x.id===s.id);
            if(idx>-1) this.sessions[idx]=updated;
            if(this.activeSessionId===s.id) {/* nothing extra */}
            this.cancelRename();
          } else {
            this.renameDialog.error='저장 실패';
          }
        }catch(e){
          this.renameDialog.error='네트워크 오류';
        } finally {
          this.renameDialog.saving=false;
        }
      },
      openDeleteSession(s){
        this.deleteDialog.session=s;
        this.deleteDialog.error=null;
        this.deleteDialog.deleting=false;
        this.deleteDialog.open=true;
      },
      cancelDelete(){
        if(this.deleteDialog.deleting) return;
        this.deleteDialog.open=false;
        this.deleteDialog.session=null;
        this.deleteDialog.error=null;
      },
      async confirmDeleteSession(){
        if(!this.deleteDialog.session || this.deleteDialog.deleting) return;
        const s=this.deleteDialog.session;
        this.deleteDialog.deleting=true; this.deleteDialog.error=null;
        try{
          const r=await fetch(`/api/chat/sessions/${s.id}/`,{method:'DELETE',headers:this.apiHeaders(false)});
          if(r.status===204){
            this.sessions=this.sessions.filter(x=>x.id!==s.id);
            if(this.activeSessionId===s.id){
              this.activeSessionId=null; this.messages=[];
              if(this.sessions.length) this.selectSession(this.sessions[0].id);
            }
            this.cancelDelete();
          } else {
            this.deleteDialog.error='삭제 실패';
          }
        }catch(e){
          this.deleteDialog.error='네트워크 오류';
        } finally {
          this.deleteDialog.deleting=false;
        }
      },
      focusInput(){ this.$nextTick(()=>{ const ta=document.querySelector('textarea'); if(ta) ta.focus(); }); },
      insertNewline(e){ const ta=e.target; const start=ta.selectionStart; const end=ta.selectionEnd; this.currentMessage=this.currentMessage.slice(0,start)+'\n'+this.currentMessage.slice(end); this.$nextTick(()=>{ ta.selectionStart=ta.selectionEnd=start+1; }); },
      setExample(txt){ this.currentMessage=txt; this.sendMessage(); },
      setupWS(){ const protocol=location.protocol==='https:'?'wss://':'ws://'; const url=protocol+location.host+'/ws/chat/'; this.ws=new WebSocket(url); this.ws.onopen=()=>{ this.wsConnected=true; this.reconnectWait=1000; if(this.pendingInit){ const initMsg=this.pendingInit; this.pendingInit=null; this.sendMessage(initMsg); } }; this.ws.onclose=()=>{ this.wsConnected=false; if(this.isLoading && this.streamingBot){ this.streamingBot.isError=true; } setTimeout(()=>this.setupWS(), Math.min(this.reconnectWait,10000)); this.reconnectWait*=2; }; this.ws.onmessage=(evt)=>{ try{ const p=JSON.parse(evt.data); this.handlePayload(p); }catch(e){} }; },
      handlePayload(p){ if(p.type==='session'){ const exists=this.sessions.find(x=>x.id===p.session_id); if(!exists){ this.sessions.unshift({id:p.session_id,title:p.title}); } this.activeSessionId=p.session_id; }
        if(!this.streamingBot && p.type==='token'){ this.createStreamingBot(); }
        if(p.type==='sources'){ if(!this.streamingBot) this.createStreamingBot(); this.streamingBot.sources=p.sources||[]; return; }
        if(p.type==='token'){ this.streamingBot.content+=p.text; this.scrollToBottom(); return; }
        if(p.type==='end'){ this.isLoading=false; this.streamingBot=null; this.scrollToBottom(); return; }
        if(p.type==='error'){ if(!this.streamingBot) this.createStreamingBot(); this.streamingBot.isError=true; this.streamingBot.content+='\n[오류] '+(p.message||'알 수 없는 오류'); this.isLoading=false; this.streamingBot=null; }
      },
      createStreamingBot(){ const botMsg={id:this.messageId++,type:'bot',content:'',sources:[],timestamp:new Date()}; this.messages.push(botMsg); this.streamingBot=botMsg; },
      sendMessage(text){ const content=(typeof text==='string')?text:this.currentMessage; if(!content.trim()||this.isLoading) return; if(!this.wsConnected){ if(!this.pendingInit) this.pendingInit=content; return; } const userMsg={id:this.messageId++,type:'user',content:content,timestamp:new Date()}; this.messages.push(userMsg); if(typeof text!=='string') this.currentMessage=''; else if(this.currentMessage===content) this.currentMessage=''; this.isLoading=true; const payload={action:'chat',query:content}; if(this.activeSessionId) payload.session_id=this.activeSessionId; this.ws.send(JSON.stringify(payload)); this.scrollToBottom(); },
      formatMessage(c){ return c.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>'); },
      formatSimilarity(d){ if(d===null||d===undefined||isNaN(d)) return '-'; const v=1 - d; return v.toFixed(2); },
      scrollToBottom(){ this.$nextTick(()=>{ const el=this.$refs.messagesContainer; if(el){ el.scrollTop=el.scrollHeight; } }); }
    }
  }).mount('#app');
</script>
</body>
