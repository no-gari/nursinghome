<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareBridge - AI 상담</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <style>
      body { font-family:'Pretendard', -apple-system,BlinkMacSystemFont,'Segoe UI','Roboto',sans-serif; }
      .chat-scroll { scrollbar-width:thin; scrollbar-color:#cbd5e1 transparent; }
      .chat-scroll::-webkit-scrollbar { width:10px; }
      .chat-scroll::-webkit-scrollbar-track { background:transparent; }
      .chat-scroll::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:6px; border:2px solid transparent; background-clip:padding-box; }
      .chat-scroll::-webkit-scrollbar-thumb:hover { background:#94a3b8; }
      .msg-bubble a { text-decoration:underline; }
      .fade-top, .fade-bottom { position:sticky; height:20px; z-index:10; }
      .fade-top { top:0; background:linear-gradient(to bottom, rgba(255,255,255,1), rgba(255,255,255,0)); }
      .fade-bottom { bottom:0; background:linear-gradient(to top, rgba(255,255,255,1), rgba(255,255,255,0)); }
      @media (max-width: 768px){ .sidebar-col { display:none; } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
<header id="siteHeader" class="sticky top-0 z-40 bg-white/85 backdrop-blur border-b border-slate-200">
  {% include 'core/_navbar.html' %}
</header>
<main id="app" class="flex-1 flex overflow-hidden relative">
  <!-- 모바일 오버레이 -->
  <div v-show="mobileSidebarOpen" class="fixed inset-0 z-30 bg-black/30 lg:hidden" @click="closeMobileSidebar"></div>

  <!-- Sidebar -->
  <aside :class="sidebarClasses">
    <div class="px-4 h-12 flex items-center justify-between border-b border-slate-200">
      <h2 class="text-xs font-semibold tracking-wide text-slate-600 select-none">대화 목록</h2>
      <div class="flex items-center gap-1">
        <button @click="createSession" class="inline-flex items-center justify-center w-8 h-8 rounded-lg border border-slate-300 bg-white text-slate-600 hover:border-slate-500 hover:text-slate-800" title="새 대화">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button @click="closeMobileSidebar" class="lg:hidden inline-flex items-center justify-center w-8 h-8 rounded-lg border border-slate-300 bg-white text-slate-600 hover:border-slate-500" title="닫기">
          <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto chat-scroll">
      <ul class="py-1 text-sm">
        <li v-for="s in sessions" :key="s.id" @click="selectSession(s.id)"
            :class="['group cursor-pointer px-3 py-2 flex items-center gap-2 border-l-2', s.id===activeSessionId ? 'bg-indigo-50 border-indigo-500 text-slate-900 font-medium' : 'border-transparent text-slate-600 hover:bg-slate-100']">
          <span class="flex-1 truncate" v-text="s.title || '제목없음'"></span>
          <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition">
            <button @click.stop="renameSession(s)" class="w-6 h-6 rounded-md flex items-center justify-center text-slate-500 hover:text-slate-700 hover:bg-white/70 border border-transparent hover:border-slate-300" title="이름 변경">✎</button>
            <button @click.stop="deleteSession(s)" class="w-6 h-6 rounded-md flex items-center justify-center text-slate-500 hover:text-rose-600 hover:bg-white/70 border border-transparent hover:border-rose-300" title="삭제">🗑</button>
          </div>
        </li>
      </ul>
      <div v-if="sessions.length===0" class="px-4 py-6 text-center text-xs text-slate-500">세션이 없습니다.</div>
    </div>
    <div class="p-3 border-t border-slate-200 text-[11px] text-slate-500">자동 저장됩니다</div>
  </aside>

  <!-- Chat column -->
  <section class="flex-1 flex flex-col min-w-0">
    <!-- Toolbar -->
    <div class="h-12 px-4 flex items-center gap-3 border-b border-slate-200 bg-white/70 backdrop-blur">
      <!-- 모바일 햄버거 -->
      <button @click="openMobileSidebar" class="lg:hidden inline-flex items-center justify-center w-9 h-9 rounded-lg border border-slate-300 bg-white text-slate-600 hover:border-slate-500" title="메뉴">
        <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <div class="flex items-center gap-2 text-slate-500">
        <svg class="w-5 h-5 text-indigo-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17l-5 3 1.9-5.8L4 9.5l6-.2L12 4l2 5.3 6 .2-4.9 4.7L17 20z"/></svg>
        <span class="text-sm font-semibold text-slate-700" v-text="activeSessionTitle || '새 대화'"></span>
      </div>

      <div class="flex gap-2 ml-auto">
        <button @click="renameActive()" :disabled="!activeSessionId" class="px-3 h-8 text-xs rounded-md border border-slate-300 bg-white text-slate-600 disabled:opacity-40 hover:border-slate-500 hover:text-slate-800">이름 변경</button>
        <button @click="createSession" class="px-3 h-8 text-xs rounded-md bg-indigo-600 text-white hover:bg-indigo-500">새 대화</button>
      </div>
    </div>

    <!-- Messages -->
    <div class="flex-1 overflow-y-auto chat-scroll relative" ref="messagesContainer">
      <div class="fade-top"></div>
      <div class="max-w-3xl mx-auto w-full px-4 pt-4 pb-40">
        <!-- Suggestions -->
        <div v-if="messages.length===0 && !isLoading" class="flex flex-wrap gap-3 mb-6">
          <button @click="setExample('서울 A등급 요양원 추천해줘')" class="px-4 py-2 rounded-full text-xs font-medium bg-white border border-slate-200 shadow-sm hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-700 transition">서울 A등급 추천</button>
          <button @click="setExample('대기자가 적은 곳 찾아줘')" class="px-4 py-2 rounded-full text-xs font-medium bg-white border border-slate-200 shadow-sm hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-700 transition">대기 적은 곳</button>
          <button @click="setExample('물리치료 프로그램 있는 곳 알려줘')" class="px-4 py-2 rounded-full text-xs font-medium bg-white border border-slate-200 shadow-sm hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-700 transition">물리치료 프로그램</button>
          <button @click="setExample('비급여 비용 저렴한 곳 비교해줘')" class="px-4 py-2 rounded-full text-xs font-medium bg-white border border-slate-200 shadow-sm hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-700 transition">비급여 저렴 비교</button>
          <button @click="setExample('경기도 10년 이상 운영 A등급 추천')" class="px-4 py-2 rounded-full text-xs font-medium bg-white border border-slate-200 shadow-sm hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-700 transition">경기 10년+ A등급</button>
        </div>
        <!-- Messages Loop -->
        <div v-for="m in messages" :key="m.id" class="mb-6 flex" :class="m.type==='user' ? 'justify-end' : 'justify-start'">
          <div class="flex items-start gap-3 max-w-full" :class="m.type==='user' ? 'flex-row-reverse' : ''">
            <div class="w-9 h-9 rounded-full flex items-center justify-center shadow-sm text-white"
                 :class="m.type==='user' ? 'bg-indigo-600' : 'bg-slate-700'">
              <svg v-if="m.type==='user'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5Z"/><path d="M3.6 20.2C4.6 16.9 8 15 12 15s7.4 1.9 8.4 5.2"/></svg>
              <svg v-else viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V9a5 5 0 0 1 10 0v2"/><path d="M12 16h.01"/></svg>
            </div>
            <div class="relative group">
              <div class="msg-bubble rounded-2xl px-4 py-3 text-[14.5px] leading-relaxed shadow-sm whitespace-pre-wrap break-words"
                   :class="m.type==='user' ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700'" v-html="formatMessage(m.content)"></div>
              <div v-if="m.sources && m.sources.length" class="mt-2 ml-1 p-3 rounded-xl bg-slate-50 border border-slate-200 text-[12px] text-slate-600 space-y-1 w-full max-w-md">
                <div class="font-semibold text-slate-700 text-xs">참고 소스</div>
                <div v-for="s in m.sources" :key="s.id" class="truncate">{{ s.rank }}. [{{ s.type }}] {{ s.name }}</div>
              </div>
            </div>
          </div>
        </div>
        <!-- Loading -->
        <div v-if="isLoading && !streamingBot" class="flex items-center gap-3 text-xs text-slate-500">
          <span class="inline-flex w-6 h-6 rounded-full bg-slate-700 text-white items-center justify-center">🤖</span>
          <span>답변 준비 중...</span>
          <span class="flex gap-1"><span class="w-2 h-2 rounded-full bg-slate-400 animate-pulse"></span><span class="w-2 h-2 rounded-full bg-slate-400 animate-pulse delay-150"></span><span class="w-2 h-2 rounded-full bg-slate-400 animate-pulse delay-300"></span></span>
        </div>
      </div>
      <div class="fade-bottom"></div>
    </div>

    <!-- Input -->
    <div class="fixed left-0 right-0 bottom-0 bg-white/95 backdrop-blur border-t border-slate-200">
      <div class="max-w-3xl mx-auto px-4 py-4">
        <div class="relative">
          <textarea v-model="currentMessage" @keydown.enter.exact.prevent="sendMessage" @keydown.enter.shift.prevent="insertNewline" rows="1"
                    :disabled="isLoading"
                    class="w-full resize-none rounded-2xl border border-slate-300 bg-white px-4 py-4 pr-16 text-sm shadow-sm focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 max-h-52"
                    placeholder="무엇이든 물어보세요... (예: 서울 A등급 요양원)"></textarea>
          <button @click="sendMessage" :disabled="isLoading || !currentMessage.trim()"
                  class="absolute bottom-2 right-2 h-11 px-5 rounded-xl text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-500 disabled:opacity-40 disabled:cursor-not-allowed shadow-sm flex items-center gap-1">
            <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5l7 7-7 7"/></svg>
            <span>전송</span>
          </button>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
const { createApp } = Vue;
createApp({
  data(){return{
    messages:[],currentMessage:'',isLoading:false,messageId:1,ws:null,wsConnected:false,reconnectWait:1000,streamingBot:null,pendingInit:null,
    sessions:[],activeSessionId:null,loadingSessions:false,
    mobileSidebarOpen:false
  }},
  computed:{
    activeSessionTitle(){
      const s=this.sessions.find(x=>x.id===this.activeSessionId);
      return s ? s.title : '';
    },
    sidebarClasses(){
      return [
        'w-60 bg-white border-r border-slate-200 flex flex-col transition-transform duration-300 ease-in-out',
        // 모바일: fixed positioning with slide animation
        'fixed lg:static inset-y-0 left-0 z-40',
        // 모바일에서 열림/닫힘 상태
        this.mobileSidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'
      ].join(' ');
    }
  },
  mounted(){
    this.fetchSessions().then(()=>{
      const p=new URLSearchParams(window.location.search);
      const sid=p.get('session');
      if(sid){
        this.selectSession(parseInt(sid));
      } else if(this.sessions.length){
        this.selectSession(this.sessions[0].id);
      }
    });
    this.setupWS();
  },
  methods:{
    csrf(){ return document.querySelector('meta[name="csrf-token"]').getAttribute('content'); },
    apiHeaders(json=true){ const h={'X-CSRFToken':this.csrf()}; if(json) h['Content-Type']='application/json'; return h; },

    // 사이드바 토글 메소드들
    openMobileSidebar(){
      this.mobileSidebarOpen = true;
      document.body.style.overflow = 'hidden';
    },
    closeMobileSidebar(){
      this.mobileSidebarOpen = false;
      document.body.style.overflow = 'auto';
    },

    async fetchSessions(){
      if(this.loadingSessions) return;
      this.loadingSessions=true;
      try{
        const r=await fetch('/api/chat/sessions/');
        if(r.ok){
          this.sessions=await r.json();
        }
      }catch(e){
        console.warn('세션 목록 로드 실패:', e);
      } finally{
        this.loadingSessions=false;
      }
    },

    async createSession(){
      try{
        const r=await fetch('/api/chat/sessions/',{
          method:'POST',
          headers:this.apiHeaders(),
          body:JSON.stringify({title:'새 대화'})
        });
        if(r.ok){
          const s=await r.json();
          this.sessions.unshift(s);
          this.selectSession(s.id,true);
          // 모바일에서 새 세션 생성 후 사이드바 닫기
          if(window.innerWidth < 1024) {
            this.closeMobileSidebar();
          }
        }
      }catch(e){
        console.warn('세션 생성 실패:', e);
      }
    },

    async selectSession(id, justCreated=false){
      if(this.activeSessionId===id) return;
      this.activeSessionId=id;
      this.messages=[];

      // 모바일에서 세션 선택 시 사이드바 닫기
      if(window.innerWidth < 1024) {
        this.closeMobileSidebar();
      }

      try{
        const r=await fetch(`/api/chat/sessions/${id}/messages/`);
        if(r.ok){
          const data=await r.json();
          for(const m of data.messages){
            this.messages.push(m);
            this.messageId++;
          }
          this.scrollToBottom();
          if(justCreated) this.focusInput();
        }
      }catch(e){
        console.warn('세션 메시지 로드 실패:', e);
      }
    },

    renameActive(){ if(!this.activeSessionId) return; const s=this.sessions.find(x=>x.id===this.activeSessionId); if(!s) return; this.renameSession(s); },
    async renameSession(s){ const title=prompt('새 제목 입력', s.title||''); if(title===null) return; const newTitle=title.trim(); if(!newTitle || newTitle===s.title) return; try{ const r=await fetch(`/api/chat/sessions/${s.id}/`,{method:'PATCH',headers:this.apiHeaders(),body:JSON.stringify({title:newTitle})}); if(r.ok){ const updated=await r.json(); const idx=this.sessions.findIndex(x=>x.id===s.id); if(idx>-1) this.sessions[idx]=updated; } }catch(e){} },
    async deleteSession(s){ if(!confirm('삭제하시겠습니까?')) return; try{ const r=await fetch(`/api/chat/sessions/${s.id}/`,{method:'DELETE',headers:this.apiHeaders(false)}); if(r.status===204){ this.sessions=this.sessions.filter(x=>x.id!==s.id); if(this.activeSessionId===s.id){ this.activeSessionId=null; this.messages=[]; if(this.sessions.length) this.selectSession(this.sessions[0].id); } } }catch(e){} },
    focusInput(){ this.$nextTick(()=>{ const ta=document.querySelector('textarea'); if(ta) ta.focus(); }); },
    insertNewline(e){ const ta=e.target; const start=ta.selectionStart; const end=ta.selectionEnd; this.currentMessage=this.currentMessage.slice(0,start)+'\n'+this.currentMessage.slice(end); this.$nextTick(()=>{ ta.selectionStart=ta.selectionEnd=start+1; }); },
    setExample(txt){ this.currentMessage=txt; this.sendMessage(); },
    setupWS(){ const protocol=location.protocol==='https:'?'wss://':'ws://'; const url=protocol+location.host+'/ws/chat/'; this.ws=new WebSocket(url); this.ws.onopen=()=>{ this.wsConnected=true; this.reconnectWait=1000; if(this.pendingInit){ const initMsg=this.pendingInit; this.pendingInit=null; this.sendMessage(initMsg); } }; this.ws.onclose=()=>{ this.wsConnected=false; if(this.isLoading && this.streamingBot){ this.streamingBot.isError=true; } setTimeout(()=>this.setupWS(), Math.min(this.reconnectWait,10000)); this.reconnectWait*=2; }; this.ws.onmessage=(evt)=>{ try{ const p=JSON.parse(evt.data); this.handlePayload(p); }catch(e){} }; },
    handlePayload(p){ if(p.type==='session'){ const exists=this.sessions.find(x=>x.id===p.session_id); if(!exists){ this.sessions.unshift({id:p.session_id,title:p.title}); } this.activeSessionId=p.session_id; }
      if(!this.streamingBot && p.type==='token'){ this.createStreamingBot(); }
      if(p.type==='sources'){ if(!this.streamingBot) this.createStreamingBot(); this.streamingBot.sources=p.sources||[]; return; }
      if(p.type==='token'){ this.streamingBot.content+=p.text; this.scrollToBottom(); return; }
      if(p.type==='end'){ this.isLoading=false; this.streamingBot=null; this.scrollToBottom(); return; }
      if(p.type==='error'){ if(!this.streamingBot) this.createStreamingBot(); this.streamingBot.isError=true; this.streamingBot.content+='\n[오류] '+(p.message||'알 수 없는 오류'); this.isLoading=false; this.streamingBot=null; }
    },
    createStreamingBot(){ const botMsg={id:this.messageId++,type:'bot',content:'',sources:[],timestamp:new Date()}; this.messages.push(botMsg); this.streamingBot=botMsg; },
    sendMessage(text){ const content=(typeof text==='string')?text:this.currentMessage; if(!content.trim()||this.isLoading) return; if(!this.wsConnected){ if(!this.pendingInit) this.pendingInit=content; return; } const userMsg={id:this.messageId++,type:'user',content:content,timestamp:new Date()}; this.messages.push(userMsg); if(typeof text!=='string') this.currentMessage=''; else if(this.currentMessage===content) this.currentMessage=''; this.isLoading=true; const payload={action:'chat',query:content}; if(this.activeSessionId) payload.session_id=this.activeSessionId; this.ws.send(JSON.stringify(payload)); this.scrollToBottom(); },
    formatMessage(c){ return c.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\n/g,'<br>'); },
    scrollToBottom(){ this.$nextTick(()=>{ const el=this.$refs.messagesContainer; if(el){ el.scrollTop=el.scrollHeight; } }); }
  }
}).mount('#app');
</script>
</body>
</html>
